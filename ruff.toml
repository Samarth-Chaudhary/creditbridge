line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "C4", "I"]
ignore = [
    "E501",   # Line length (handled by formatter or HTML strings)
    "E402",   # Module level import not at top (needed for sys.path setup)
    "RUF001", # Ambiguous unicode character (INR symbol, em dashes)
    "RUF002", # Ambiguous unicode character in docstring
    "RUF003", # Ambiguous unicode character in comment
]
